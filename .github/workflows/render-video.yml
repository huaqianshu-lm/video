name: Render full video

on:
  workflow_dispatch:
    inputs:
      video_slug:
        description: Video slug used by source and asset paths
        required: true
        type: string
      composition_id:
        description: Remotion Composition ID
        required: true
        type: string
      render_input_url:
        description: URL of the private render input package
        required: true
        type: string
      render_input_sha256:
        description: SHA-256 of the render input package
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    name: Render complete MP4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VIDEO_SLUG: ${{ inputs.video_slug }}
      COMPOSITION_ID: ${{ inputs.composition_id }}
      RENDER_INPUT_URL: ${{ inputs.render_input_url }}
      RENDER_INPUT_SHA256: ${{ inputs.render_input_sha256 }}
      RENDER_INPUT_TOKEN: ${{ secrets.RENDER_INPUT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Verify CJK font
        run: |
          fc-cache -f
          fc-match -f '%{family}\n' 'Noto Sans CJK SC' | grep -q 'Noto Sans CJK'

      - name: Install dependencies
        run: npm ci

      - name: Download and verify render input package
        run: |
          [[ "$RENDER_INPUT_URL" =~ ^https?:// ]]
          [[ "$RENDER_INPUT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          input_archive="$RUNNER_TEMP/render-input.zip"
          input_root="$RUNNER_TEMP/render-input"
          auth_args=()
          if [[ -n "${RENDER_INPUT_TOKEN:-}" ]]; then
            auth_args=(-H "Authorization: Bearer $RENDER_INPUT_TOKEN")
          fi
          curl --fail --location --retry 3 --retry-all-errors -H 'Accept: application/octet-stream' "${auth_args[@]}" "$RENDER_INPUT_URL" -o "$input_archive"
          echo "$RENDER_INPUT_SHA256  $input_archive" | sha256sum --check --status
          mkdir -p "$input_root"
          unzip -q "$input_archive" -d "$input_root"
          node harness/src/cli.mjs render-input validate-path "$input_root"

      - name: Install render input into temporary workspace
        run: |
          input_root="$RUNNER_TEMP/render-input"
          manifest_slug="$(node -e "console.log(require(process.argv[1]).videoSlug)" "$input_root/render-input.json")"
          manifest_composition="$(node -e "console.log(require(process.argv[1]).compositionId)" "$input_root/render-input.json")"
          test "$manifest_slug" = "$VIDEO_SLUG"
          test "$manifest_composition" = "$COMPOSITION_ID"
          mkdir -p videos src/videos assets
          cp -R "$input_root/videos/$VIDEO_SLUG" "videos/$VIDEO_SLUG"
          cp -R "$input_root/src/videos/$VIDEO_SLUG" "src/videos/$VIDEO_SLUG"
          cp "$input_root/assets/$VIDEO_SLUG-assets.zip" "assets/$VIDEO_SLUG-assets.zip"
          node harness/src/cli.mjs render-input entry \
            --manifest "$input_root/render-input.json" \
            --output src/RenderInputRoot.tsx
          mkdir -p public/local-assets
          unzip -q "assets/$VIDEO_SLUG-assets.zip" -d public/local-assets

      - name: Validate workflow inputs
        run: |
          [[ "$VIDEO_SLUG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ "$COMPOSITION_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          test -f "src/videos/${VIDEO_SLUG}/generated/audio-manifest.json"
          test -f "src/videos/${VIDEO_SLUG}/generated/subtitle-manifest.json"
          test -f "src/videos/${VIDEO_SLUG}/generated/timeline-manifest.json"
          test -f "src/videos/${VIDEO_SLUG}/video.config.ts"
          test -f src/RenderInputRoot.tsx

      - name: Verify render inputs
        run: |
          test -f "public/local-assets/${VIDEO_SLUG}/subtitles/captions.vtt"
          expected_audio_count="$(VIDEO_SLUG="$VIDEO_SLUG" node -e "const manifest = require('./src/videos/' + process.env.VIDEO_SLUG + '/generated/audio-manifest.json'); console.log(manifest.scenes.reduce((count, scene) => count + scene.segments.length, 0));")"
          actual_audio_count="$(find "public/local-assets/${VIDEO_SLUG}/audio" -type f -name '*.mp3' | wc -l | tr -d ' ')"
          test "$actual_audio_count" -eq "$expected_audio_count"

      - name: Type-check project
        run: npm run check

      - name: Render complete video
        run: npx remotion render src/RenderInputRoot.tsx "$COMPOSITION_ID" "out/${VIDEO_SLUG}.mp4"

      - name: Upload rendered video
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.video_slug }}
          path: out/${{ inputs.video_slug }}.mp4
          if-no-files-found: error
          retention-days: 7
