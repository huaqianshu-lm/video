name: Render full video

run-name: ${{ inputs.video_slug }} / ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      video_slug:
        description: Video slug used by source and asset paths
        required: true
        type: string
      composition_id:
        description: Remotion Composition ID
        required: true
        type: string
      dispatch_id:
        description: Unique dispatch ID used to identify this Run
        required: true
        type: string
      render_input_url:
        description: URL of the private render input package
        required: true
        type: string
      render_input_sha256:
        description: SHA-256 of the render input package
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    name: Render complete MP4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VIDEO_SLUG: ${{ inputs.video_slug }}
      COMPOSITION_ID: ${{ inputs.composition_id }}
      RENDER_INPUT_URL: ${{ inputs.render_input_url }}
      RENDER_INPUT_SHA256: ${{ inputs.render_input_sha256 }}
      RENDER_INPUT_TOKEN: ${{ secrets.RENDER_INPUT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Verify CJK font
        run: |
          fc-cache -f
          fc-match -f '%{family}\n' 'Noto Sans CJK SC' | grep -q 'Noto Sans CJK'

      - name: Install dependencies
        run: npm ci

      - name: Download and verify render input package
        run: |
          [[ "$RENDER_INPUT_URL" =~ ^https?:// ]]
          [[ "$RENDER_INPUT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          input_archive="$RUNNER_TEMP/render-input.zip"
          input_root="$RUNNER_TEMP/render-input"
          auth_args=()
          if [[ -n "${RENDER_INPUT_TOKEN:-}" ]]; then
            auth_args=(-H "Authorization: Bearer $RENDER_INPUT_TOKEN")
          fi
          curl --fail --location --retry 3 --retry-all-errors -H 'Accept: application/octet-stream' "${auth_args[@]}" "$RENDER_INPUT_URL" -o "$input_archive"
          echo "$RENDER_INPUT_SHA256  $input_archive" | sha256sum --check --status
          mkdir -p "$input_root"
          python3 scripts/lib/archive.py extract "$input_archive" "$input_root"
          node scripts/video-input.mjs validate "$input_root"

      - name: Install render input into temporary workspace
        run: |
          input_root="$RUNNER_TEMP/render-input"
          node scripts/video-input.mjs install "$input_root" --workspace "$RUNNER_TEMP/video-workspace"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/video-workspace/node_modules"
          node --input-type=module - "$input_root/render-input.json" <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (manifest.videoSlug !== process.env.VIDEO_SLUG || manifest.compositionId !== process.env.COMPOSITION_ID) {
            throw new Error('Workflow inputs differ from the verified input package');
          }
          NODE

      - name: Type-check project
        working-directory: ${{ runner.temp }}/video-workspace
        run: npm run check

      - name: Render complete video
        working-directory: ${{ runner.temp }}/video-workspace
        run: npx remotion render src/RenderInputRoot.tsx "$COMPOSITION_ID" "out/${VIDEO_SLUG}.mp4"

      - name: Upload rendered video
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.video_slug }}
          path: ${{ runner.temp }}/video-workspace/out/${{ inputs.video_slug }}.mp4
          if-no-files-found: error
          retention-days: 7
