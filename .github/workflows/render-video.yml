name: Render full video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render complete MP4
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Verify CJK font
        run: |
          fc-cache -f
          fc-match -f '%{family}\n' 'Noto Sans CJK SC' | grep -q 'Noto Sans CJK'

      - name: Install dependencies
        run: npm ci

      - name: Extract video assets
        run: |
          mkdir -p public/local-assets
          unzip -q assets/claude-code-install-assets.zip -d public/local-assets

      - name: Verify render inputs
        run: |
          test -f public/local-assets/claude-code-install/subtitles/captions.vtt
          test "$(find public/local-assets/claude-code-install/audio -type f -name '*.mp3' | wc -l | tr -d ' ')" -eq 76

      - name: Type-check project
        run: npm run check

      - name: Render claude-code-install
        run: npx remotion render claude-code-install out/claude-code-install.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v6
        with:
          name: claude-code-install
          path: out/claude-code-install.mp4
          if-no-files-found: error
          retention-days: 7
