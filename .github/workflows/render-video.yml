name: Render full video

run-name: ${{ inputs.video_slug }} / ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      video_slug:
        description: Video slug used by source and asset paths
        required: true
        type: string
      composition_id:
        description: Remotion Composition ID
        required: true
        type: string
      dispatch_id:
        description: Unique Harness dispatch ID used to identify this Run
        required: true
        type: string
      render_input_url:
        description: URL of the private render input package
        required: true
        type: string
      render_input_sha256:
        description: SHA-256 of the render input package
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    name: Render complete MP4
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VIDEO_SLUG: ${{ inputs.video_slug }}
      COMPOSITION_ID: ${{ inputs.composition_id }}
      RENDER_INPUT_URL: ${{ inputs.render_input_url }}
      RENDER_INPUT_SHA256: ${{ inputs.render_input_sha256 }}
      RENDER_INPUT_TOKEN: ${{ secrets.RENDER_INPUT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Verify CJK font
        run: |
          fc-cache -f
          fc-match -f '%{family}\n' 'Noto Sans CJK SC' | grep -q 'Noto Sans CJK'

      - name: Install dependencies
        run: npm ci

      - name: Download and verify render input package
        run: |
          [[ "$RENDER_INPUT_URL" =~ ^https?:// ]]
          [[ "$RENDER_INPUT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          input_archive="$RUNNER_TEMP/render-input.zip"
          input_root="$RUNNER_TEMP/render-input"
          auth_args=()
          if [[ -n "${RENDER_INPUT_TOKEN:-}" ]]; then
            auth_args=(-H "Authorization: Bearer $RENDER_INPUT_TOKEN")
          fi
          curl --fail --location --retry 3 --retry-all-errors -H 'Accept: application/octet-stream' "${auth_args[@]}" "$RENDER_INPUT_URL" -o "$input_archive"
          echo "$RENDER_INPUT_SHA256  $input_archive" | sha256sum --check --status
          mkdir -p "$input_root"
          unzip -q "$input_archive" -d "$input_root"
          node harness/src/cli.mjs render-input validate-path "$input_root"

      - name: Install render input into temporary workspace
        run: |
          input_root="$RUNNER_TEMP/render-input"
          manifest_values="$(node --input-type=module - "$input_root/render-input.json" <<'NODE'
          import fs from 'node:fs';
          import {requireWorkflowDefinition, workflowPaths} from './harness/src/workflows/registry.mjs';
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const workflow = requireWorkflowDefinition({workflow: manifest.workflow, workflowVersion: manifest.workflowVersion});
          const paths = workflowPaths({config: {workflow: workflow.id, workflowVersion: workflow.version, slug: manifest.videoSlug}}, manifest.videoSlug);
          if (!manifest.entry?.configPath || !manifest.entry?.componentPath) throw new Error('render-input.json is missing Remotion entry paths');
          console.log(manifest.videoSlug);
          console.log(manifest.compositionId);
          console.log(paths.sourceDirectory);
          console.log(paths.remotionDirectory);
          console.log(paths.assetArchive);
          console.log(manifest.entry.configPath);
          console.log(manifest.entry.componentPath);
          NODE
          )"
          mapfile -t manifest_values_array <<< "$manifest_values"
          manifest_slug="${manifest_values_array[0]}"
          manifest_composition="${manifest_values_array[1]}"
          source_directory="${manifest_values_array[2]}"
          remotion_directory="${manifest_values_array[3]}"
          asset_archive="${manifest_values_array[4]}"
          config_path="${manifest_values_array[5]}"
          component_path="${manifest_values_array[6]}"
          test "$manifest_slug" = "$VIDEO_SLUG"
          test "$manifest_composition" = "$COMPOSITION_ID"
          mkdir -p "$(dirname "$source_directory")" "$(dirname "$remotion_directory")" "$(dirname "$asset_archive")"
          cp -R "$input_root/$source_directory" "$source_directory"
          cp -R "$input_root/$remotion_directory" "$remotion_directory"
          cp "$input_root/$asset_archive" "$asset_archive"
          node harness/src/cli.mjs render-input entry \
            --manifest "$input_root/render-input.json" \
            --output src/RenderInputRoot.tsx
          mkdir -p public/local-assets
          unzip -q "$asset_archive" -d public/local-assets

      - name: Validate workflow inputs
        run: |
          [[ "$VIDEO_SLUG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ "$COMPOSITION_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          manifest_config_path="$(node -e "console.log(require(process.argv[1]).entry.configPath)" "$RUNNER_TEMP/render-input/render-input.json")"
          manifest_component_path="$(node -e "console.log(require(process.argv[1]).entry.componentPath)" "$RUNNER_TEMP/render-input/render-input.json")"
          test -f "$manifest_config_path"
          test -f "$manifest_component_path"
          test -f src/RenderInputRoot.tsx

      - name: Verify render inputs
        run: |
          node harness/src/cli.mjs render-input validate-path "$RUNNER_TEMP/render-input"

      - name: Type-check project
        run: npm run check

      - name: Render complete video
        run: npx remotion render src/RenderInputRoot.tsx "$COMPOSITION_ID" "out/${VIDEO_SLUG}.mp4"

      - name: Upload rendered video
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.video_slug }}
          path: out/${{ inputs.video_slug }}.mp4
          if-no-files-found: error
          retention-days: 7
