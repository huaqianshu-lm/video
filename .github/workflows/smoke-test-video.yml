name: Smoke test video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Render representative frames and short clip
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Verify CJK font
        run: |
          fc-cache -f
          fc-match -f '%{family}\n' 'Noto Sans CJK SC' | grep -q 'Noto Sans CJK'

      - name: Install dependencies
        run: npm ci

      - name: Extract video assets
        run: |
          mkdir -p public/local-assets
          unzip -q assets/claude-code-what-is-v2-assets.zip -d public/local-assets

      - name: Verify render inputs
        run: |
          test -f public/local-assets/claude-code-what-is-v2/captions.vtt
          test "$(find public/local-assets/claude-code-what-is-v2/audio -type f -name '*.mp3' | wc -l | tr -d ' ')" -eq 166

      - name: Type-check project
        run: npm run check

      - name: Render representative frames
        run: |
          mkdir -p smoke
          npx remotion still claude-code-what-is-v2 --frame=30 --output=smoke/frame-000030.png
          npx remotion still claude-code-what-is-v2 --frame=660 --output=smoke/frame-000660.png
          npx remotion still claude-code-what-is-v2 --frame=18000 --output=smoke/frame-018000.png

      - name: Render first 10 seconds
        run: npx remotion render claude-code-what-is-v2 smoke/first-10-seconds.mp4 --frames=0-299

      - name: Upload smoke-test artifacts
        uses: actions/upload-artifact@v6
        with:
          name: claude-code-what-is-v2-smoke-test
          path: smoke/
          if-no-files-found: error
          retention-days: 7
