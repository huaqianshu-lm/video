name: Smoke test video

on:
  workflow_dispatch:
    inputs:
      video_slug:
        description: Video slug used by source and asset paths
        required: true
        type: string
      composition_id:
        description: Remotion Composition ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke-test:
    name: Render representative frames and short clip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VIDEO_SLUG: ${{ inputs.video_slug }}
      COMPOSITION_ID: ${{ inputs.composition_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Verify CJK font
        run: |
          fc-cache -f
          fc-match -f '%{family}\n' 'Noto Sans CJK SC' | grep -q 'Noto Sans CJK'

      - name: Install dependencies
        run: npm ci

      - name: Validate workflow inputs
        run: |
          [[ "$VIDEO_SLUG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          [[ "$COMPOSITION_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          test -f "assets/${VIDEO_SLUG}-assets.zip"
          test -f "src/videos/${VIDEO_SLUG}/generated/audio-manifest.json"
          test -f "src/videos/${VIDEO_SLUG}/generated/subtitle-manifest.json"
          test -f "src/videos/${VIDEO_SLUG}/generated/timeline-manifest.json"
          test -f "src/videos/${VIDEO_SLUG}/video.config.ts"
          test -n "$(find "src/videos/${VIDEO_SLUG}" -maxdepth 1 -type f -name '*Video.tsx' -print -quit)"

      - name: Extract video assets
        run: |
          mkdir -p public/local-assets
          unzip -q "assets/${VIDEO_SLUG}-assets.zip" -d public/local-assets

      - name: Verify render inputs
        run: |
          test -f "public/local-assets/${VIDEO_SLUG}/subtitles/captions.vtt"
          expected_audio_count="$(VIDEO_SLUG="$VIDEO_SLUG" node -e "const manifest = require('./src/videos/' + process.env.VIDEO_SLUG + '/generated/audio-manifest.json'); console.log(manifest.scenes.reduce((count, scene) => count + scene.segments.length, 0));")"
          actual_audio_count="$(find "public/local-assets/${VIDEO_SLUG}/audio" -type f -name '*.mp3' | wc -l | tr -d ' ')"
          test "$actual_audio_count" -eq "$expected_audio_count"

      - name: Type-check project
        run: npm run check

      - name: Select representative frames
        id: frames
        run: |
          VIDEO_SLUG="$VIDEO_SLUG" node <<'NODE' >> "$GITHUB_OUTPUT"
          const timeline = require(`./src/videos/${process.env.VIDEO_SLUG}/generated/timeline-manifest.json`);
          const fps = 30;
          const scenes = timeline.scenes;
          if (!Array.isArray(scenes) || scenes.length < 3) {
            throw new Error('Expected at least 3 scenes in timeline manifest');
          }
          const frameInScene = (scene) => Math.round((scene.offset + scene.duration * 0.65) * fps);
          console.log(`early=${frameInScene(scenes[0])}`);
          console.log(`middle=${frameInScene(scenes[Math.floor(scenes.length / 2)])}`);
          console.log(`late=${frameInScene(scenes[scenes.length - 1])}`);
          NODE

      - name: Render representative frames
        run: |
          mkdir -p smoke
          npx remotion still "$COMPOSITION_ID" --frame="${{ steps.frames.outputs.early }}" --output=smoke/frame-early.png
          npx remotion still "$COMPOSITION_ID" --frame="${{ steps.frames.outputs.middle }}" --output=smoke/frame-middle.png
          npx remotion still "$COMPOSITION_ID" --frame="${{ steps.frames.outputs.late }}" --output=smoke/frame-late.png

      - name: Render first 10 seconds
        run: npx remotion render "$COMPOSITION_ID" smoke/first-10-seconds.mp4 --frames=0-299

      - name: Upload smoke-test artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.video_slug }}-smoke-test
          path: smoke/
          if-no-files-found: error
          retention-days: 7
